[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sit-diffusers"
version = "0.1.0"
description = "Diffusers-style SiT implementation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "diffusers>=0.31.0",
  "torch>=2.2.0",
  "torchvision>=0.17.0",
  "transformers>=4.40.0",
  "timm>=0.9.0",
  "safetensors>=0.4.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
